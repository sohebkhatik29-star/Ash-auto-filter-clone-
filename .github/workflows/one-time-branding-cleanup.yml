name: One-time branding cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove old VJ branding and apply Ash details
        shell: python
        run: |
          from pathlib import Path
          import os

          root = Path('.')
          replacements = {
              'https://youtube.com/@Tech_VJ': 'https://www.youtube.com/@tech_as_0',
              'https://www.youtube.com/@Tech_VJ': 'https://www.youtube.com/@tech_as_0',
              'https://t.me/vj_bot_disscussion': 'https://t.me/ash_movie_j',
              'https://t.me/vj_bots': 'https://t.me/MoviesGroupG3',
              '@VJ_Bots': '@movies_1780',
              '@VJ_Botz': '@movies_1780',
              '@KingVJ01': '@movies_1780',
              '@KingVJ0': '@movies_1780',
              'Tech VJ': 'Tech AS',
              'TECH VJ': 'TECH AS',
              'Tech_VJ': 'tech_as_0',
              'KingVJ': 'movies_1780',
              'VJ_Bots': 'movies_1780',
              'VJ_Botz': 'movies_1780',
              'cloned_vjbotz': 'ash_clone_bots',
              'TechVJ': 'AshCore',
          }

          old_dir = root / 'TechVJ'
          new_dir = root / 'AshCore'
          if old_dir.exists() and not new_dir.exists():
              old_dir.rename(new_dir)

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # The user-facing bot username is configured here when no env override is supplied.
          config = root / 'config.py'
          if config.exists():
              text = config.read_text(encoding='utf-8')
              text = text.replace('https://graph.org/file/ce1723991756e48c35aa1.jpg', 'https://graph.org/file/ce1723991756e48c35aa1.jpg')
              config.write_text(text, encoding='utf-8')

          # This workflow is intentionally one-time; remove it before committing the cleanup.
          workflow = root / '.github' / 'workflows' / 'one-time-branding-cleanup.yml'
          if workflow.exists():
              workflow.unlink()

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes needed."
            exit 0
          fi
          git commit -m "Remove old VJ branding and update bot details"
          git push origin HEAD:main
